<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFF Fleet Tracker </title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#0d1524;--tx:#e8f4ff;--mut:#8ba4bf;--br:#1d3553;--pri:#00c8ff;--side:#050914;--ok:#00e58b;--wa:#ffad33;--er:#ff496c;--sh:0 4px 22px #00bfff12;--glow:0 0 0 1px #00c8ff18,0 0 18px #00c8ff0b}
/* Cyber Track theme */
:root{--cyber-accent:#00c8ff}

*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}
body:has(.lg){background:radial-gradient(ellipse at top right,#102b49 0%,#070b14 58%,#03050a 100%)}
.shell{display:flex;min-height:100vh}.content{flex:1;min-width:0}
aside{width:230px;background:var(--side);color:#cfe0f3;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;z-index:1000}
.brand{font-size:20px;font-weight:700;color:#fff;padding:6px 10px 18px}.brand small{display:block;font-size:12px;font-weight:400;color:#7f93ad;margin-top:2px}
aside nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto}
aside nav button{display:flex;align-items:center;gap:10px;text-align:start;background:none;border:0;color:#b9cbe0;padding:10px 12px;border-radius:10px;width:100%}
aside nav button:hover{background:#00c8ff14;color:#e8faff;box-shadow:inset 0 0 0 1px #00c8ff22}aside nav button.on{background:linear-gradient(100deg,#007ca8,#00c8ff);color:#02111b;font-weight:700;box-shadow:0 0 18px #00c8ff25}
.usr{border-top:1px solid #ffffff1a;padding-top:12px;font-size:13px;display:flex;flex-direction:column;gap:8px}.usr button{background:#ffffff14;color:#fff;border:0}
main{padding:24px;max-width:1100px;margin:auto}h2{margin:0 0 14px;font-size:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{padding:8px 14px;border:1px solid var(--br);background:var(--card);border-radius:10px;cursor:pointer}
button.p{background:linear-gradient(110deg,#007ca8,#00c8ff);color:#03111b;border-color:#00c8ff;font-weight:700;box-shadow:0 0 14px #00c8ff18}button.d{color:var(--er)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--br);border-radius:10px;background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0;box-shadow:0 0 15px #00c8ff16}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.c{background:linear-gradient(145deg,#101c2e,#0b1321);border:1px solid var(--br);border-radius:16px;padding:16px;box-shadow:var(--sh),var(--glow)}
.g .c{border-top:4px solid var(--pri)}.g .c:nth-child(2){border-top-color:var(--ok)}.g .c:nth-child(3){border-top-color:var(--wa)}.g .c:nth-child(4){border-top-color:var(--er)}.g .c:nth-child(5){border-top-color:#6366f1}
.c h3{margin:0 0 4px;font-size:30px}.c span{color:var(--mut);font-size:13px}
.w{overflow-x:auto;border-radius:16px;border:1px solid var(--br);box-shadow:var(--sh);background:var(--card)}
table{width:100%;border-collapse:collapse}th,td{padding:11px 12px;border-bottom:1px solid var(--br);text-align:start;white-space:nowrap}
th{background:var(--bg);color:var(--mut);font-size:12px}tr:hover td{background:#00c8ff0d}tr:last-child td{border-bottom:0}
.t{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;color:#fff}
#map,#rmap{position:relative;z-index:0;border-radius:16px;border:1px solid var(--br);box-shadow:var(--sh)}#map{height:70vh}
.m{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:2000;padding:12px}
.m form{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px #0006}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}.r{display:flex;gap:8px;margin-top:14px}
.n{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:14px;margin-bottom:12px;font-size:14px;box-shadow:var(--sh)}.mut{color:var(--mut);font-size:13px}
#toast{position:fixed;bottom:18px;inset-inline-start:18px;background:#06101d;color:#dff8ff;border:1px solid #00c8ff55;box-shadow:0 0 18px #00c8ff16;padding:10px 16px;border-radius:10px;z-index:3000;display:none}
.lg{max-width:440px;margin:10vh auto;padding:30px 26px;text-align:center}.lg-title{display:block;text-align:center;font-size:clamp(30px,5vw,40px);font-weight:800;line-height:1.2;letter-spacing:.4px;color:#fff;margin:0 auto 24px;text-shadow:0 0 22px #00c8ff45}.lg h2{text-align:center}
.truck-picker{margin:14px 0;padding:12px;border:1px solid var(--br);border-radius:12px;background:#07101c}.truck-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:8px 0 12px}.truck-choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid var(--br);border-radius:10px;padding:8px;margin:0;cursor:pointer;color:var(--tx);background:#0b1523}.truck-choice:has(input:checked){border-color:var(--pri);box-shadow:0 0 0 1px var(--pri);background:#00c8ff12}.truck-choice input{width:auto;accent-color:var(--pri)}.truck-choice svg{width:66px;height:42px;display:block}.truck-colors{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0}.truck-color{display:flex;align-items:center;gap:5px;border:1px solid var(--br);padding:5px 8px;border-radius:20px;margin:0;cursor:pointer}.truck-color input{width:auto;accent-color:var(--pri)}.color-dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid #fff5}.truck-preview{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:#0003;margin-top:8px}.truck-preview svg{width:76px;height:48px}.truck-cell svg{width:58px;height:36px;vertical-align:middle}.truck-cell{display:inline-flex;align-items:center;gap:6px}.aff-truck-div{background:transparent!important;border:0!important}.aff-truck-marker{width:48px;height:42px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 3px #000c)}.aff-truck-marker svg{width:48px;height:42px;overflow:visible}.truck-button{padding:5px 8px;font-size:12px}
.company-pin{width:30px;height:30px;border-radius:50% 50% 50% 5px;transform:rotate(-45deg);background:#ef4444;border:2px solid #fff;box-shadow:0 2px 8px #000a;display:flex;align-items:center;justify-content:center;color:#fff}
.company-pin span{transform:rotate(45deg);font-size:15px;line-height:1}
.company-tooltip{background:#081523!important;color:#e8f4ff!important;border:1px solid #00c8ff!important;border-radius:7px!important;box-shadow:0 2px 8px #0008!important;font-weight:700;padding:4px 7px!important}
.company-tooltip:before{border-top-color:#00c8ff!important}
.company-pick-map{height:320px;border:1px solid var(--br);border-radius:12px;margin:8px 0;z-index:0}
.company-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.company-card{border:1px solid var(--br);border-radius:12px;padding:12px;background:#07111f;display:flex;flex-direction:column;gap:7px;min-width:0}
.company-card .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.company-card .actions button{font-size:12px}
.plan-company-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0}
.plan-company-option{display:flex;align-items:flex-start;gap:8px;background:#07111f;border:1px solid var(--br);border-radius:10px;padding:10px;margin:0;cursor:pointer}
.plan-company-option input{width:auto;margin-top:3px;accent-color:var(--pri);flex-shrink:0}
.plan-company-option span{display:block;min-width:0;white-space:normal}
.plan-company-option small{display:block;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
.visit-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--br)}
.visit-row:last-child{border-bottom:0}.visit-row input{width:auto;margin-top:5px}
.visit-done{opacity:.62}.visit-done strong{text-decoration:line-through}
.driver-map{height:42vh;min-height:270px;border:1px solid var(--br);border-radius:14px;margin:12px 0;z-index:0}
.route-note{padding:10px 12px;border-inline-start:3px solid var(--pri);background:#00c8ff0c;border-radius:8px;margin:10px 0}
@media(max-width:760px){.company-pick-map{height:260px}.driver-map{height:36vh;min-height:230px}}
@media(max-width:760px){.shell{display:block}aside{position:fixed;inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;padding:6px;border-top:1px solid #ffffff1a}
.brand,.usr span{display:none}aside nav{flex-direction:row;overflow-x:auto;gap:2px}aside nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;white-space:nowrap;width:auto}
.usr{border:0;padding:0;flex-direction:row}main{padding:14px 12px 96px}#map{height:60vh}#toast{bottom:84px}}

.trk-bar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-bottom:2px}
.trk-chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:7px 13px;border-radius:99px;font-size:14px}
.trk-chip.on{background:linear-gradient(110deg,#007ca8,#00c8ff);color:#03111b;border-color:#00c8ff;font-weight:700}
.trk-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid #fff5}
.trk-info{min-height:22px;margin:0 0 10px;font-size:14px;color:var(--mut)}.trk-info b{color:var(--tx)}
.trk-tooltip{background:#062014!important;color:#dfffee!important;border:1px solid #00e58b!important;border-radius:7px!important;box-shadow:0 2px 8px #0008!important;font-weight:700;padding:3px 7px!important}
.trk-tooltip:before{border-top-color:#00e58b!important}.trk-tooltip.off{opacity:.65;border-color:#8ba4bf!important}
.r{flex-wrap:wrap}
.rpl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rpl input[type=range]{flex:1;min-width:150px;padding:0;accent-color:var(--pri)}.rpl select{width:auto}
.rpl-info{margin-top:8px;font-size:13px;color:var(--mut);min-height:20px}.rpl-info b{color:var(--tx)}
.warn{color:var(--wa)}
.mapfs{position:fixed!important;inset:0;width:100vw!important;height:100vh!important;height:100dvh!important;max-height:none!important;z-index:2500!important;border-radius:0!important;margin:0!important;border:0!important}
body.fs-on{overflow:hidden}
body.fs-live .trk-bar{position:fixed;top:8px;left:52px;right:8px;z-index:2600;background:#06101de6;border-radius:12px;padding:6px 8px;margin:0}
body.fs-live .trk-info{position:fixed;bottom:8px;left:8px;right:8px;z-index:2600;background:#06101de6;border-radius:10px;padding:8px 12px;margin:0}
body.fs-rep #rpl{position:fixed;bottom:8px;left:8px;right:8px;z-index:2600;margin:0;background:#06101df2}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
// ---------- الحالة ----------
const LS=localStorage, $=s=>document.querySelector(s);
if(!LS.aff_theme)LS.aff_theme='cyber-track';
const empty=()=>({users:[],vehicles:[],drivers:[],devices:[],companies:[],dailyPlans:[],positions:{}});
let db=Object.assign(empty(),JSON.parse(LS.aff_db||'{}'));
db.companies=Array.isArray(db.companies)?db.companies:[];db.dailyPlans=Array.isArray(db.dailyPlans)?db.dailyPlans:[];
let me=JSON.parse(sessionStorage.aff_me||'null'), page='dash', map, layer, fitted=false;
let noMerge=false,liveT={},manualStop=false,routeEditingId=null,companyPickerMap=null,companyPickMarker=null,driverRouteMap=null,driverRouteLayer=null,driverRouteFitted=false,trackerCurrentPoint=null;
const normalizeDB=o=>{const x=Object.assign(empty(),o||{});x.companies=Array.isArray(x.companies)?x.companies:[];x.dailyPlans=Array.isArray(x.dailyPlans)?x.dailyPlans:[];x.users=Array.isArray(x.users)?x.users:[];x.vehicles=Array.isArray(x.vehicles)?x.vehicles:[];x.drivers=Array.isArray(x.drivers)?x.drivers:[];x.devices=Array.isArray(x.devices)?x.devices:[];x.positions=x.positions&&typeof x.positions==='object'?x.positions:{};return x};
function uid(){return(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/-/g,'')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TRUCK_TYPES=[
  {id:'box',name:'نقل صندوق مغلق'},
  {id:'semi',name:'قاطرة ومقطورة'},
  {id:'tanker',name:'صهريج'},
  {id:'dump',name:'قلاب'},
  {id:'flatbed',name:'سطحة نقل'}
];
const TRUCK_COLORS=[
  {id:'#00c8ff',name:'أزرق سماوي'}, {id:'#e53935',name:'أحمر'},
  {id:'#22c55e',name:'أخضر'}, {id:'#f59e0b',name:'برتقالي'},
  {id:'#a855f7',name:'بنفسجي'}, {id:'#f8fafc',name:'أبيض'},
  {id:'#64748b',name:'رمادي'}, {id:'#ec4899',name:'وردي'},
  {id:'#eab308',name:'أصفر'}, {id:'#0f766e',name:'تركواز'}
];
function truckSvg(type='box',color='#00c8ff'){
  if(!TRUCK_COLORS.some(c=>c.id===color))color='#00c8ff';
  const body={
    box:`<rect x="4" y="6" width="36" height="23" rx="2" fill="${color}" stroke="#dbeafe" stroke-opacity=".65"/><path d="M9 11h26M9 15h26M9 19h26" stroke="#ffffff" stroke-opacity=".2"/>`,
    semi:`<rect x="3" y="10" width="28" height="19" rx="2" fill="${color}" stroke="#dbeafe" stroke-opacity=".65"/><path d="M8 15h18M8 20h18" stroke="#fff" stroke-opacity=".25"/><rect x="32" y="25" width="8" height="4" rx="1" fill="#94a3b8"/>`,
    tanker:`<rect x="3" y="10" width="38" height="17" rx="8.5" fill="${color}" stroke="#dbeafe" stroke-opacity=".7"/><path d="M10 12v13M34 12v13" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>`,
    dump:`<path d="M5 13L36 7 40 27H5Z" fill="${color}" stroke="#dbeafe" stroke-opacity=".65"/><path d="M10 15l22-4M11 20l24-4" stroke="#fff" stroke-opacity=".3"/><path d="M5 27h35" stroke="#cbd5e1" stroke-width="2"/>`,
    flatbed:`<rect x="4" y="23" width="37" height="5" rx="1" fill="${color}" stroke="#dbeafe" stroke-opacity=".65"/><rect x="8" y="10" width="9" height="13" rx="1" fill="${color}"/><rect x="20" y="14" width="9" height="9" rx="1" fill="${color}"/><rect x="31" y="9" width="7" height="14" rx="1" fill="${color}"/>`
  };
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 42" role="img" aria-label="شاحنة"><g>${body[type]||body.box}<path d="M42 20V13Q42 10 46 10H54L64 21V29H42Z" fill="${color}" stroke="#dbeafe" stroke-opacity=".8"/><path d="M47 13h6l6 7H47Z" fill="#bcecff" stroke="#083344" stroke-width=".8"/><path d="M42 22h21" stroke="#0f172a" stroke-opacity=".5"/><circle cx="16" cy="31" r="6" fill="#111827" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="36" cy="31" r="6" fill="#111827" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="54" cy="31" r="6" fill="#111827" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="16" cy="31" r="2" fill="#94a3b8"/><circle cx="36" cy="31" r="2" fill="#94a3b8"/><circle cx="54" cy="31" r="2" fill="#94a3b8"/><rect x="63" y="23" width="3" height="4" rx="1" fill="#fde68a"/></g></svg>`;
}
function avatarTypeOf(x){return TRUCK_TYPES.some(t=>t.id===x?.avatarType)?x.avatarType:'box'}
function avatarColorOf(x){return TRUCK_COLORS.some(c=>c.id===x?.avatarColor)?x.avatarColor:'#00c8ff'}
function truckAvatar(x,extra=''){return `<span class="truck-cell ${extra}">${truckSvg(avatarTypeOf(x),avatarColorOf(x))}</span>`}
function truckPicker(prefix, item={}){
  const type=avatarTypeOf(item),color=avatarColorOf(item);
  return `<div class="truck-picker" id="${prefix}TruckPicker"><b>اختيار افتار الشاحنة</b><p class="mut">اختر شكل الشاحنة واللون لتمييز السائق أو هاتفه على الخريطة.</p>
  <label>شكل الشاحنة</label><div class="truck-choices">${TRUCK_TYPES.map(t=>`<label class="truck-choice"><input type="radio" name="avatarType" value="${t.id}" ${type===t.id?'checked':''} onchange="previewTruck('${prefix}')"><span>${truckSvg(t.id,color)}</span><span>${t.name}</span></label>`).join('')}</div>
  <label>لون الشاحنة</label><div class="truck-colors">${TRUCK_COLORS.map(c=>`<label class="truck-color"><input type="radio" name="avatarColor" value="${c.id}" ${color===c.id?'checked':''} onchange="previewTruck('${prefix}')"><span class="color-dot" style="background:${c.id}"></span><span>${c.name}</span></label>`).join('')}</div>
  <div class="truck-preview"><span class="truck-preview-icon">${truckSvg(type,color)}</span><span><b>معاينة الافتار</b><br><small class="mut">سيظهر هذا الشكل بجانب السائق على الخريطة</small></span></div></div>`;
}
function previewTruck(prefix){
  const root=document.getElementById(prefix+'TruckPicker');if(!root)return;
  const type=root.querySelector('input[name="avatarType"]:checked')?.value||'box';
  const color=root.querySelector('input[name="avatarColor"]:checked')?.value||'#00c8ff';
  root.querySelector('.truck-preview-icon').innerHTML=truckSvg(type,color);
  root.querySelectorAll('.truck-choice svg').forEach((svg,i)=>{svg.outerHTML=truckSvg(TRUCK_TYPES[i].id,color)});
}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3500)};
async function hash(p,s){if(!(window.crypto&&crypto.subtle))throw Error('افتح الصفحة عبر HTTPS أو localhost');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64e=(o,i)=>btoa(unescape(encodeURIComponent(JSON.stringify(o,null,i))));
const b64d=c=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\s/g,'')),x=>x.charCodeAt(0))));

// ---------- قاعدة البيانات: Firebase Realtime Database ----------
const FB_CFG={apiKey:"AIzaSyAQeQcy41zNUz78VngfQs6EoOAJrzBMsZo",authDomain:"aff-fleet.firebaseapp.com",databaseURL:"https://aff-fleet-default-rtdb.europe-west1.firebasedatabase.app",projectId:"aff-fleet",storageBucket:"aff-fleet.firebasestorage.app",messagingSenderId:"311185727594",appId:"1:311185727594:web:2508657a636ff59cb9aa13"};
let fb=null,fbOnline=false,lastJson='',liveOn=false,rfT=null,trkSig='';
try{firebase.initializeApp(FB_CFG);fb=firebase.database()}catch(e){console.error(e)}
const R=p=>p?fb.ref(p):fb.ref();
const dbJson=()=>{const o={...db};delete o.positions;return JSON.stringify(o)};
function applyRemote(o){const pos=db.positions||{};db=normalizeDB(o);db.positions=pos;LS.aff_db=JSON.stringify(db)}
async function fetchRemote(){
  const s=await R('aff/db').get();
  if(!s.exists())return null;
  lastJson=s.val().json;return JSON.parse(lastJson);
}
async function pull(){try{const rm=await fetchRemote();if(rm)applyRemote(rm)}catch(e){}}
async function save(){
  LS.aff_db=JSON.stringify(db);
  if(!fb)return;
  try{
    const j=dbJson();lastJson=j;
    await R('aff/db').set({json:j,t:firebase.database.ServerValue.TIMESTAMP});
    toast('تم الحفظ');
  }catch(e){toast('فشل الحفظ: '+e.message)}
}
// تحديث الشاشة عند وصول بيانات جديدة (بحد أقصى مرة كل ثانية، وبدون المساس بنموذج مفتوح).
function scheduleRefresh(){
  if(rfT)return;
  rfT=setTimeout(()=>{rfT=null;
    if(!me||document.querySelector('.m'))return;
    const tg=document.activeElement?.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
    if(page==='map'){if(followId||!map||!map._popup||!map.hasLayer(map._popup))drawMap()}
    else if(page==='dash'||page==='alerts')render();
    else if(page==='track'&&me.role==='tracker'){const sg=JSON.stringify([db.companies,db.dailyPlans]);if(sg!==trkSig){trkSig=sg;render()}}
  },1000);
}
function startBaseSync(){
  if(!fb)return;
  R('.info/connected').on('value',s=>{fbOnline=!!s.val();const e=$('#fbst');if(e)e.textContent=fbOnline?'🟢 متصل':'🔴 غير متصل'});
  R('aff/db').on('value',s=>{if(!s.exists())return;const j=s.val().json;if(j===lastJson)return;lastJson=j;try{applyRemote(JSON.parse(j))}catch(e){return}scheduleRefresh()});
}
function startLiveSync(){

    if(has)setCompanyPickPoint(center[0],center[1],{noAddr:true});

async function setCompanyPickPoint(lat,lng,o={}){

  if(hint)hint.textContent='✅ تم تحديد الموقع على الخريطة'+(o.noAddr?'':'… جاري جلب العنوان');
  if(companyPickerMap&&window.L){
    if(companyPickMarker)companyPickMarker.setLatLng([lat,lng]);
    else{companyPickMarker=L.marker([lat,lng],{draggable:true}).addTo(companyPickerMap);companyPickMarker.on('dragend',()=>{const p=companyPickMarker.getLatLng();setCompanyPickPoint(p.lat,p.lng)})}
    if(o.fly)companyPickerMap.setView([lat,lng],Math.max(companyPickerMap.getZoom(),16));
  }
  if(o.noAddr||!ad)return;
  const my=++cpSeq;
  try{const x=await addr(lat,lng);if(my!==cpSeq)return;const t=fmtAddr(x,'road');
    if(ad.dataset.touched!=='1')ad.value=t;if(hint)hint.textContent='✅ تم تحديد الموقع: '+t;
  }catch(e){if(my===cpSeq&&hint)hint.textContent='✅ تم تحديد الموقع (تعذّر جلب العنوان، اكتبه يدويًا إن أردت)'}
}

async function expFull(){
  if(!fb)return toast('قاعدة البيانات غير متصلة');
  const f=$('#bk_f').value,t=$('#bk_t').value;
  if(!f||!t||f>t)return toast('اختر فترة صحيحة (من ≤ إلى)');
  if((new Date(t)-new Date(f))/864e5>92)return toast('الحد الأقصى للنسخة الواحدة 93 يومًا');
  const btn=$('#bkFull'),old=btn.textContent;btn.disabled=true;
  try{
    const tracks={},trs=db.users.filter(u=>u.role==='tracker');let n=0;
    for(let i=0;i<trs.length;i++){
      btn.textContent=`جاري تحميل المسارات… ${i+1}/${trs.length}`;
      const sn=await R('tracks/'+trs[i].id).orderByKey().startAt(f).endAt(t).get();
      if(sn.exists()){tracks[trs[i].id]=sn.val();n+=Object.keys(sn.val()).length}
    }
    dl(JSON.stringify({format:'aff-full-backup',version:1,exportedAt:new Date().toISOString(),range:{from:f,to:t},db:{...db,positions:{}},tracks}),`aff-full-backup-${f}_${t}.json`);
    toast(`تم تصدير النسخة الكاملة (${n} يوم مسار)`);
  }catch(e){toast('فشل التصدير: '+e.message)}
  finally{btn.disabled=false;btn.textContent=old}
}

let rm,rpts=[];
const hav=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
const GAP_MS=15*60*1000; /* انقطاع الإشارة: فجوة أكبر من 15 دقيقة بين نقطتين */
function analyze(p){
  let dist=0,max=0,stops=[],i=0;
  for(let k=1;k<p.length;k++){const d=hav(p[k-1],p[k]);if(d>15)dist+=d}
  p.forEach(x=>{if(x.s!=null&&x.s>max)max=x.s});
  while(i<p.length){let j=i;while(j+1<p.length&&hav(p[i],p[j+1])<50)j++;if(p[j].t-p[i].t>=300000)stops.push({a:p[i],b:p[j]});i=j+1}
  /* زمن الحركة/التوقف/بدون إشارة: كل فترة بين نقطتين متتاليتين تُصنَّف حسب السرعة الفعلية */
  let mov=0,stp=0,gap=0,movd=0;
  for(let k=1;k<p.length;k++){const dt=p[k].t-p[k-1].t;if(dt<=0)continue;if(dt>GAP_MS){gap+=dt;continue}const d=hav(p[k-1],p[k]);if(d>15&&d/(dt/1000)>=1){mov+=dt;movd+=d}else stp+=dt}
  return{dist,max,stops,mov,stp,gap,movd};
}

const COMPANY_RADIUS=200; /* متر: أي نقطة داخل هذه الدائرة حول الشركة تُحسب "داخل الشركة" */
function nearCompany(p){
  let best=null,bd=Infinity;
  (db.companies||[]).forEach(c=>{const la=Number(c.lat),lo=Number(c.lng);if(c.lat===''||c.lng===''||!Number.isFinite(la)||!Number.isFinite(lo))return;const d=hav(p,{lat:la,lng:lo});if(d<bd){bd=d;best=c}});
  return bd<=COMPANY_RADIUS?best:null;
}
/* يجهّز أسطر التقرير: كل توقف (نقاط متقاربة أقل من 50م) سطر واحد فيه وقت الانتظار + اسم المنطقة أو الشركة */
async function buildRows(prog){
  const wt=ms=>new Promise(r=>setTimeout(r,ms)),rows=[],inCo=rpts.map(nearCompany);let i=0;
  while(i<rpts.length){
    let j=i;
    if(inCo[i]){while(j+1<rpts.length&&inCo[j+1]&&inCo[j+1].id===inCo[i].id)j++}
    else{while(j+1<rpts.length&&!inCo[j+1]&&hav(rpts[i],rpts[j+1])<50)j++}
    const sp=rpts.slice(i,j+1).filter(x=>x.s!=null).map(x=>x.s);
    rows.push({p:rpts[i],wait:rpts[j].t-rpts[i].t,spd:sp.length?Math.round(sp.reduce((a,b)=>a+b,0)/sp.length*3.6):'',c:inCo[i]});
    i=j+1;
  }
  const anchors=[];
  for(let k=0;k<rows.length;k++){
    const r=rows[k];prog&&prog(k+1,rows.length);
    if(r.c){r.place='داخل نطاق: '+r.c.name;r.co=true;continue}
    const rad=r.wait>=60000?40:250,an=anchors.find(x=>hav(x.p,r.p)<rad);
    if(an){r.place=an.name;continue}
    const cached=!!AC[ak(r.p.lat,r.p.lng)];let name='';
    for(let t=0;t<2&&!name;t++){try{name=fmtAddr(await addr(r.p.lat,r.p.lng),'road')}catch(e){await wt(3000)}}
    name=name||'تعذّر تحديد المنطقة';
    anchors.push({p:r.p,name});r.place=name;
    if(!cached)await wt(1100);
  }
  return rows;
}

function rplAt(vt){
  const p=rpl.pts;let lo=0,hi=p.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(p[m].t<=vt)lo=m;else hi=m}
  const a=p[lo],b=p[hi],f=b.t>a.t?Math.min(1,Math.max(0,(vt-a.t)/(b.t-a.t))):0;
  return{i:lo,lat:a.lat+(b.lat-a.lat)*f,lng:a.lng+(b.lng-a.lng)*f,gap:b.t-a.t>GAP_MS}
}
function rplDraw(force){

  }
}
function rplTick(ts){

  const trs=db.users.filter(x=>x.role==='tracker'&&(u==='all'||x.id===u));

  const rows=[];
  for(let i=0;i<trs.length;i++){
    const tr=trs[i];o.innerHTML=`<p class="mut">جاري تحميل بيانات ${esc(tr.name)} (${i+1}/${trs.length})…</p>`;
    const sn=await R('tracks/'+tr.id).orderByKey().startAt(f).endAt(t).get(),v=sn.exists()?sn.val():{},dates=new Set(Object.keys(v));
    (db.dailyPlans||[]).forEach(p=>{if(p.userId===tr.id&&p.date>=f&&p.date<=t)dates.add(p.date)});
    [...dates].sort().forEach(d=>{const pts=v[d]?Object.values(v[d]).filter(okPt).map(mapPt).sort((a,b)=>a.t-b.t):[];rows.push(dayRow(tr,d,pts))});
    await new Promise(r=>setTimeout(r,0));
  }
  const by={};
  rows.forEach(r=>{const b=by[r.id]=by[r.id]||{id:r.id,name:r.name,days:0,km:0,mov:0,stp:0,gap:0,stops:0,planned:0,done:0,gps:0};if(r.has)b.days++;['km','mov','stp','gap','stops','planned','done','gps'].forEach(k=>b[k]+=r[k])});
  trs.forEach(tr=>{if(!by[tr.id])by[tr.id]={id:tr.id,name:tr.name,days:0,km:0,mov:0,stp:0,gap:0,stops:0,planned:0,done:0,gps:0}});
  return{f,t,rows,tot:Object.values(by)};
}

// ---------- ملء الشاشة للخرائط ----------
let fsMap=null;
function fsReset(){
  document.querySelectorAll('.mapfs').forEach(e=>e.classList.remove('mapfs'));
  document.body.classList.remove('fs-on','fs-live','fs-rep');fsMap=null;
  if(document.fullscreenElement&&document.exitFullscreen)try{document.exitFullscreen().catch(()=>{})}catch(e){}
}
function exitFS(){
  const m=fsMap;fsReset();
  if(m)try{if(m._fsa){m._fsa.innerHTML='⛶';m._fsa.title='ملء الشاشة'}setTimeout(()=>m.invalidateSize(),80)}catch(e){}
}
function toggleFS(m){
  if(fsMap===m){exitFS();return}
  if(fsMap)exitFS();
  const el=m.getContainer();fsMap=m;
  el.classList.add('mapfs');document.body.classList.add('fs-on');
  document.body.classList.toggle('fs-live',el.id==='map');document.body.classList.toggle('fs-rep',el.id==='rmap');
  if(m._fsa){m._fsa.innerHTML='✕';m._fsa.title='خروج من ملء الشاشة'}
  /* على الكمبيوتر نطلب ملء شاشة المتصفح أيضًا؛ على الآيفون يكفي الوضع الداخلي */
  try{const de=document.documentElement;if(de.requestFullscreen)de.requestFullscreen().catch(()=>{})}catch(e){}
  setTimeout(()=>m.invalidateSize(),80);
}
function addFS(m){
  const C=L.Control.extend({options:{position:'topleft'},onAdd(){
    const c=L.DomUtil.create('div','leaflet-bar leaflet-control'),b=L.DomUtil.create('a','',c);
    b.href='#';b.title='ملء الشاشة';b.innerHTML='⛶';b.setAttribute('role','button');m._fsa=b;
    L.DomEvent.disableClickPropagation(c);L.DomEvent.on(b,'click',e=>{L.DomEvent.preventDefault(e);toggleFS(m)});return c}});
  new C().addTo(m);
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&fsMap)exitFS()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&fsMap)exitFS()});

// ---------- العناوين (OpenStreetMap Nominatim) ----------
const AC=JSON.parse(LS.aff_addr2||'{}'),ak=(a,b)=>a.toFixed(4)+','+b.toFixed(4);
// المنطقة الكبيرة (حي/منطقة + مدينة) واسم الشارع، بدل العنوان الطويل العشوائي.
const areaOf=a=>{const s=a.suburb||a.city_district||a.quarter||a.neighbourhood||a.village||a.town||a.county||a.state_district,c=a.city||a.town||a.state;return [s,c].filter((x,i,r)=>x&&r.indexOf(x)===i).join('، ')};
const roadOf=a=>a.road||a.pedestrian||a.residential||a.footway||a.path||'';
function fmtAddr(o,m){
  const ar=o.area||'',rd=o.road||'';
  if(m==='area')return ar||o.full||'عنوان غير معروف';
  if(m==='road')return rd?(rd+(ar?'، '+ar:'')):(ar||o.full||'عنوان غير معروف');
  return (ar||o.full||'عنوان غير معروف')+(rd?' – '+rd:'');
}
async function addr(a,b){
  const k=ak(a,b);if(AC[k])return AC[k];
  const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=ar&lat=${a}&lon=${b}`);
  if(!r.ok)throw Error(r.status);const j=await r.json(),ad=j.address||{};
  AC[k]={area:areaOf(ad),road:roadOf(ad)||j.name||'',full:j.display_name||''};LS.aff_addr2=JSON.stringify(AC);return AC[k];
}
async function fillAddr(){
  for(const e of document.querySelectorAll('[data-ad]')){
    const [a,b]=e.dataset.ad.split(',').map(Number),cached=!!AC[ak(a,b)];
    try{const o=await addr(a,b);
      if(e.dataset.fmt==='stack')e.innerHTML='<b>'+esc(fmtAddr(o,'area'))+'</b>'+(o.road?'<br><small class="mut">🛣️ '+esc(o.road)+'</small>':'');
      else e.textContent=fmtAddr(o,e.dataset.fmt||'line')}catch(x){e.textContent='تعذّر جلب العنوان'}
    if(!cached)await new Promise(r=>setTimeout(r,1100));
  }
}

// ---------- تصفير بيانات محددة ----------
async function resetSel(){
  const c=n=>$('#rs_'+n).checked,ut=$('#rt_u').value,from=$('#rt_f').value,to=$('#rt_t').value;
  if(!['vehicles','drivers','devices','positions'].some(c)&&!ut)return toast('اختر ما تريد تصفيره');
  if(ut&&!fb)return toast('قاعدة البيانات غير متصلة');
  if(prompt('للتأكيد اكتب كلمة: تصفير')!=='تصفير')return;
  exp();
  if(c('vehicles')){db.vehicles=[];db.devices.forEach(d=>d.vehicleId='')}
  if(c('drivers')){db.drivers=[];db.vehicles.forEach(v=>v.driverId='')}
  if(c('devices')){db.devices=[];db.positions={}}
  if(c('positions'))db.positions={};
  await save();
  if(fb&&(c('positions')||c('devices')))try{await R('positions').remove()}catch(e){}
  if(ut){
    const ids=ut==='all'?db.users.filter(u=>u.role==='tracker').map(u=>u.id):[ut];let n=0;
    for(const id of ids){
      const sn=await R('tracks/'+id).get();if(!sn.exists())continue;
      for(const d of Object.keys(sn.val())){if((from&&d<from)||(to&&d>to))continue;
        try{await R(`tracks/${id}/${d}`).remove();n++}catch(e){}}
      if(!from&&!to)try{await R('live/'+id).remove()}catch(e){}
    }
    toast('تم حذف '+n+' يوم مسار');    liveT={};toast('تم حذف '+n+' ملف مسار');
  }else toast('تم التصفير');
  render();
}
