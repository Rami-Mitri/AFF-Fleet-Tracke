<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFF Fleet Tracker </title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#0d1524;--tx:#e8f4ff;--mut:#8ba4bf;--br:#1d3553;--pri:#00c8ff;--side:#050914;--ok:#00e58b;--wa:#ffad33;--er:#ff496c;--sh:0 4px 22px #00bfff12;--glow:0 0 0 1px #00c8ff18,0 0 18px #00c8ff0b}
/* Cyber Track theme */
:root{--cyber-accent:#00c8ff}

*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}
body:has(.lg){background:radial-gradient(ellipse at top right,#102b49 0%,#070b14 58%,#03050a 100%)}
.shell{display:flex;min-height:100vh}.content{flex:1;min-width:0}
aside{width:230px;background:var(--side);color:#cfe0f3;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;z-index:1000}
.brand{font-size:20px;font-weight:700;color:#fff;padding:6px 10px 18px}.brand small{display:block;font-size:12px;font-weight:400;color:#7f93ad;margin-top:2px}
aside nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto}
aside nav button{display:flex;align-items:center;gap:10px;text-align:start;background:none;border:0;color:#b9cbe0;padding:10px 12px;border-radius:10px;width:100%}
aside nav button:hover{background:#00c8ff14;color:#e8faff;box-shadow:inset 0 0 0 1px #00c8ff22}aside nav button.on{background:linear-gradient(100deg,#007ca8,#00c8ff);color:#02111b;font-weight:700;box-shadow:0 0 18px #00c8ff25}
.usr{border-top:1px solid #ffffff1a;padding-top:12px;font-size:13px;display:flex;flex-direction:column;gap:8px}.usr button{background:#ffffff14;color:#fff;border:0}
main{padding:24px;max-width:1100px;margin:auto}h2{margin:0 0 14px;font-size:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{padding:8px 14px;border:1px solid var(--br);background:var(--card);border-radius:10px;cursor:pointer}
button.p{background:linear-gradient(110deg,#007ca8,#00c8ff);color:#03111b;border-color:#00c8ff;font-weight:700;box-shadow:0 0 14px #00c8ff18}button.d{color:var(--er)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--br);border-radius:10px;background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0;box-shadow:0 0 15px #00c8ff16}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.c{background:linear-gradient(145deg,#101c2e,#0b1321);border:1px solid var(--br);border-radius:16px;padding:16px;box-shadow:var(--sh),var(--glow)}
.g .c{border-top:4px solid var(--pri)}.g .c:nth-child(2){border-top-color:var(--ok)}.g .c:nth-child(3){border-top-color:var(--wa)}.g .c:nth-child(4){border-top-color:var(--er)}.g .c:nth-child(5){border-top-color:#6366f1}
.c h3{margin:0 0 4px;font-size:30px}.c span{color:var(--mut);font-size:13px}
.w{overflow-x:auto;border-radius:16px;border:1px solid var(--br);box-shadow:var(--sh);background:var(--card)}
table{width:100%;border-collapse:collapse}th,td{padding:11px 12px;border-bottom:1px solid var(--br);text-align:start;white-space:nowrap}
th{background:var(--bg);color:var(--mut);font-size:12px}tr:hover td{background:#00c8ff0d}tr:last-child td{border-bottom:0}
.t{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;color:#fff}
#map,#rmap{position:relative;z-index:0;border-radius:16px;border:1px solid var(--br);box-shadow:var(--sh)}#map{height:70vh}
.m{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:2000;padding:12px}
.m form{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px #0006}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}.r{display:flex;gap:8px;margin-top:14px}
.n{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:14px;margin-bottom:12px;font-size:14px;box-shadow:var(--sh)}.mut{color:var(--mut);font-size:13px}
#toast{position:fixed;bottom:18px;inset-inline-start:18px;background:#06101d;color:#dff8ff;border:1px solid #00c8ff55;box-shadow:0 0 18px #00c8ff16;padding:10px 16px;border-radius:10px;z-index:3000;display:none}
.lg{max-width:440px;margin:10vh auto;padding:30px 26px;text-align:center}.lg-title{display:block;text-align:center;font-size:clamp(30px,5vw,40px);font-weight:800;line-height:1.2;letter-spacing:.4px;color:#fff;margin:0 auto 24px;text-shadow:0 0 22px #00c8ff45}.lg h2{text-align:center}
.truck-picker{margin:14px 0;padding:12px;border:1px solid var(--br);border-radius:12px;background:#07101c}.truck-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:8px 0 12px}.truck-choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid var(--br);border-radius:10px;padding:8px;margin:0;cursor:pointer;color:var(--tx);background:#0b1523}.truck-choice:has(input:checked){border-color:var(--pri);box-shadow:0 0 0 1px var(--pri);background:#00c8ff12}.truck-choice input{width:auto;accent-color:var(--pri)}.truck-choice svg{width:66px;height:42px;display:block}.truck-colors{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0}.truck-color{display:flex;align-items:center;gap:5px;border:1px solid var(--br);padding:5px 8px;border-radius:20px;margin:0;cursor:pointer}.truck-color input{width:auto;accent-color:var(--pri)}.color-dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid #fff5}.truck-preview{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:#0003;margin-top:8px}.truck-preview svg{width:76px;height:48px}.truck-cell svg{width:58px;height:36px;vertical-align:middle}.truck-cell{display:inline-flex;align-items:center;gap:6px}.aff-truck-div{background:transparent!important;border:0!important}.aff-truck-marker{width:48px;height:42px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 3px #000c)}.aff-truck-marker svg{width:48px;height:42px;overflow:visible}.truck-button{padding:5px 8px;font-size:12px}
@media(max-width:760px){.shell{display:block}aside{position:fixed;inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;padding:6px;border-top:1px solid #ffffff1a}
.brand,.usr span{display:none}aside nav{flex-direction:row;overflow-x:auto;gap:2px}aside nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;white-space:nowrap;width:auto}
.usr{border:0;padding:0;flex-direction:row}main{padding:14px 12px 96px}#map{height:60vh}#toast{bottom:84px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- الحالة ----------
const LS=localStorage, $=s=>document.querySelector(s);
if(!LS.aff_theme)LS.aff_theme='cyber-track';
const empty=()=>({users:[],vehicles:[],drivers:[],devices:[],positions:{}});
let db=Object.assign(empty(),JSON.parse(LS.aff_db||'{}'));
let gh=JSON.parse(LS.aff_gh||'null'), sha, me=JSON.parse(sessionStorage.aff_me||'null'), page='dash', map, layer, fitted=false;
let noMerge=false,liveT={},manualStop=false;
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TRUCK_TYPES=[
  {id:'box',name:'نقل صندوق مغلق'},
  {id:'semi',name:'قاطرة ومقطورة'},
  {id:'tanker',name:'صهريج'},
  {id:'dump',name:'قلاب'},
  {id:'flatbed',name:'سطحة نقل'}
];
const TRUCK_COLORS=[
  {id:'#00c8ff',name:'أزرق سماوي'}, {id:'#e53935',name:'أحمر'},
  {id:'#22c55e',name:'أخضر'}, {id:'#f59e0b',name:'برتقالي'},
  {id:'#a855f7',name:'بنفسجي'}, {id:'#f8fafc',name:'أبيض'},
  {id:'#64748b',name:'رمادي'}, {id:'#ec4899',name:'وردي'},
  {id:'#eab308',name:'أصفر'}, {id:'#0f766e',name:'تركواز'}
];
function truckSvg(type='box',color='#00c8ff'){
  if(!TRUCK_COLORS.some(c=>c.id===color))color='#00c8ff';
  const body={
    box:`<rect x="4" y="6" width="36" height="23" rx="2" fill="${color}" stroke="#dbeafe" stroke-opacity=".65"/><path d="M9 11h26M9 15h26M9 19h26" stroke="#ffffff" stroke-opacity=".2"/>`,
    semi:`<rect x="3" y="10" width="28" height="19" rx="2" fill="${color}" stroke="#dbeafe" stroke-opacity=".65"/><path d="M8 15h18M8 20h18" stroke="#fff" stroke-opacity=".25"/><rect x="32" y="25" width="8" height="4" rx="1" fill="#94a3b8"/>`,
    tanker:`<rect x="3" y="10" width="38" height="17" rx="8.5" fill="${color}" stroke="#dbeafe" stroke-opacity=".7"/><path d="M10 12v13M34 12v13" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>`,
    dump:`<path d="M5 13L36 7 40 27H5Z" fill="${color}" stroke="#dbeafe" stroke-opacity=".65"/><path d="M10 15l22-4M11 20l24-4" stroke="#fff" stroke-opacity=".3"/><path d="M5 27h35" stroke="#cbd5e1" stroke-width="2"/>`,
    flatbed:`<rect x="4" y="23" width="37" height="5" rx="1" fill="${color}" stroke="#dbeafe" stroke-opacity=".65"/><rect x="8" y="10" width="9" height="13" rx="1" fill="${color}"/><rect x="20" y="14" width="9" height="9" rx="1" fill="${color}"/><rect x="31" y="9" width="7" height="14" rx="1" fill="${color}"/>`
  };
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 42" role="img" aria-label="شاحنة"><g>${body[type]||body.box}<path d="M42 20V13Q42 10 46 10H54L64 21V29H42Z" fill="${color}" stroke="#dbeafe" stroke-opacity=".8"/><path d="M47 13h6l6 7H47Z" fill="#bcecff" stroke="#083344" stroke-width=".8"/><path d="M42 22h21" stroke="#0f172a" stroke-opacity=".5"/><circle cx="16" cy="31" r="6" fill="#111827" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="36" cy="31" r="6" fill="#111827" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="54" cy="31" r="6" fill="#111827" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="16" cy="31" r="2" fill="#94a3b8"/><circle cx="36" cy="31" r="2" fill="#94a3b8"/><circle cx="54" cy="31" r="2" fill="#94a3b8"/><rect x="63" y="23" width="3" height="4" rx="1" fill="#fde68a"/></g></svg>`;
}
function avatarTypeOf(x){return TRUCK_TYPES.some(t=>t.id===x?.avatarType)?x.avatarType:'box'}
function avatarColorOf(x){return TRUCK_COLORS.some(c=>c.id===x?.avatarColor)?x.avatarColor:'#00c8ff'}
function truckAvatar(x,extra=''){return `<span class="truck-cell ${extra}">${truckSvg(avatarTypeOf(x),avatarColorOf(x))}</span>`}
function truckPicker(prefix, item={}){
  const type=avatarTypeOf(item),color=avatarColorOf(item);
  return `<div class="truck-picker" id="${prefix}TruckPicker"><b>اختيار افتار الشاحنة</b><p class="mut">اختر شكل الشاحنة واللون لتمييز السائق أو هاتفه على الخريطة.</p>
  <label>شكل الشاحنة</label><div class="truck-choices">${TRUCK_TYPES.map(t=>`<label class="truck-choice"><input type="radio" name="avatarType" value="${t.id}" ${type===t.id?'checked':''} onchange="previewTruck('${prefix}')"><span>${truckSvg(t.id,color)}</span><span>${t.name}</span></label>`).join('')}</div>
  <label>لون الشاحنة</label><div class="truck-colors">${TRUCK_COLORS.map(c=>`<label class="truck-color"><input type="radio" name="avatarColor" value="${c.id}" ${color===c.id?'checked':''} onchange="previewTruck('${prefix}')"><span class="color-dot" style="background:${c.id}"></span><span>${c.name}</span></label>`).join('')}</div>
  <div class="truck-preview"><span class="truck-preview-icon">${truckSvg(type,color)}</span><span><b>معاينة الافتار</b><br><small class="mut">سيظهر هذا الشكل بجانب السائق على الخريطة</small></span></div></div>`;
}
function previewTruck(prefix){
  const root=document.getElementById(prefix+'TruckPicker');if(!root)return;
  const type=root.querySelector('input[name="avatarType"]:checked')?.value||'box';
  const color=root.querySelector('input[name="avatarColor"]:checked')?.value||'#00c8ff';
  root.querySelector('.truck-preview-icon').innerHTML=truckSvg(type,color);
  root.querySelectorAll('.truck-choice svg').forEach((svg,i)=>{svg.outerHTML=truckSvg(TRUCK_TYPES[i].id,color)});
}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3500)};
async function hash(p,s){if(!(window.crypto&&crypto.subtle))throw Error('افتح الصفحة عبر HTTPS أو localhost');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64e=(o,i)=>btoa(unescape(encodeURIComponent(JSON.stringify(o,null,i))));
const b64d=c=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\s/g,'')),x=>x.charCodeAt(0))));

// ---------- قاعدة البيانات على GitHub ----------
const url=()=>`https://api.github.com/repos/${gh.repo}/contents/${gh.path||'aff-db.json'}`;
const hd=()=>({Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json'});
function mergePos(a,b){const o={...a};for(const k in b)if(!o[k]||(b[k].t||0)>(o[k].t||0))o[k]=b[k];return o}
async function fetchRemote(){
  const r=await fetch(url(),{headers:hd(),cache:'no-store'});
  if(r.status==404){sha=undefined;return null}
  if(!r.ok)throw Error('GitHub '+r.status);
  const j=await r.json();sha=j.sha;return b64d(j.content);
}
async function pull(){
  if(!gh)return;
  try{const rm=await fetchRemote();if(rm){db=Object.assign(empty(),rm);LS.aff_db=JSON.stringify(db)}}
  catch(e){toast('تعذّر التحديث: '+e.message)}
}
async function save(){
  LS.aff_db=JSON.stringify(db);
  if(!gh)return;
  try{
    const rm=await fetchRemote();if(rm&&!noMerge)db.positions=mergePos(db.positions,rm.positions||{});
    const body={message:'AFF update',content:b64e(db,1)};if(sha)body.sha=sha;
    const p=await fetch(url(),{method:'PUT',headers:hd(),body:JSON.stringify(body)});
    if(!p.ok)throw Error(p.status);sha=(await p.json()).content.sha;toast('تم الحفظ على GitHub');
  }catch(e){toast('فشل الحفظ على GitHub: '+e.message)}
}

// ---------- الحالات ----------
const OFFLINE_MS=10*60*1000;
function posOf(v){const d=db.devices.find(d=>d.vehicleId===v.id);return d?{d,p:db.positions[d.id]}:{}}
function status(v){
  const {d,p}=posOf(v);
  if(!d)return['بدون جهاز','#6b7686'];if(!p)return['لا توجد بيانات','#6b7686'];
  if(Date.now()-p.t>OFFLINE_MS)return['غير متصل','#d93b3b'];
  return(p.speed_mps||0)>1?['يتحرك','#1a9d55']:['متوقف','#d98a00'];
}
function alerts(){
  const a=[];
  db.vehicles.forEach(v=>{const {d,p}=posOf(v);if(!d||!p)return;
    if(Date.now()-p.t>OFFLINE_MS)a.push(['critical',`المركبة ${v.name||v.plate} غير متصلة منذ ${Math.round((Date.now()-p.t)/60000)} دقيقة`]);
    if(p.battery!=null&&p.battery<15)a.push(['warning',`بطارية جهاز ${v.name||v.plate} منخفضة (${p.battery}%)`]);
    if((p.speed_mps||0)*3.6>(db.maxSpeed||120))a.push(['warning',`${v.name||v.plate} تجاوزت السرعة (${Math.round(p.speed_mps*3.6)} كم/س)`]);
  });
  db.drivers.forEach(r=>{if(r.licenseExpiry&&new Date(r.licenseExpiry)<new Date(Date.now()+30*864e5))a.push(['warning',`رخصة السائق ${r.name} تنتهي في ${r.licenseExpiry}`])});
  return a;
}

// ---------- الكيانات ----------
const E={
  vehicles:{t:'المركبات',f:[['name','الاسم'],['plate','رقم اللوحة'],['type','النوع'],['driverId','السائق','drivers'],['notes','ملاحظات']]},
  drivers:{t:'السائقون',f:[['name','الاسم'],['phone','الهاتف'],['license','رقم الرخصة'],['licenseExpiry','انتهاء الرخصة','date']]},
  devices:{t:'أجهزة GPS',f:[['name','اسم الجهاز'],['vehicleId','المركبة','vehicles'],['notes','ملاحظات']]}
};
const lookup=(c,id)=>{const x=db[c].find(x=>x.id===id);return x?(x.name||x.plate):''};
function list(k){
  const e=E[k];
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2>${e.t}</h2><button class="p" onclick="edit('${k}')">+ إضافة</button></div>
  <div class="w"><table><tr>${k==='drivers'?'<th>الافتار</th>':''}${e.f.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>
  ${db[k].map(r=>`<tr>${k==='drivers'?`<td>${truckAvatar(r)}</td>`:''}${e.f.map(f=>`<td>${esc(f[2]&&f[2]!=='date'?lookup(f[2],r[f[0]]):r[f[0]])}</td>`).join('')}<td><button onclick="edit('${k}','${r.id}')">تعديل</button> ${isAdmin()?`<button class="d" onclick="del('${k}','${r.id}')">حذف</button>`:''}</td></tr>`).join('')||`<tr><td colspan="9" class="mut">لا توجد بيانات</td></tr>`}</table></div>
  ${k==='devices'?`<p class="mut">معرّف الجهاز يُستخدم في ملف قاعدة البيانات: positions[معرّف الجهاز]. يظهر في عمود التعديل عند فتح الجهاز.</p>`:''}`;
}
function edit(k,id){
  const e=E[k],r=db[k].find(x=>x.id===id)||{};
  const m=document.createElement('div');m.className='m';
  m.innerHTML=`<form><h3>${e.t}</h3>${e.f.map(f=>`<label>${f[1]}</label>`+(f[2]&&f[2]!=='date'
    ?`<select name="${f[0]}"><option value="">—</option>${db[f[2]].map(o=>`<option value="${o.id}" ${r[f[0]]===o.id?'selected':''}>${esc(o.name||o.plate)}</option>`).join('')}</select>`
    :`<input name="${f[0]}" type="${f[2]||'text'}" value="${esc(r[f[0]])}">`)).join('')}
    ${k==='drivers'?truckPicker('driverAvatar',r):''}
    ${k==='devices'&&r.id?`<p class="mut">المعرّف: <code>${r.id}</code></p>`:''}
    <div class="r"><button class="p">حفظ</button><button type="button" onclick="this.closest('.m').remove()">إلغاء</button></div></form>`;
  m.querySelector('form').onsubmit=async ev=>{
    ev.preventDefault();const o=r.id?r:{id:uid()};
    new FormData(ev.target).forEach((v,n)=>o[n]=v.trim());
    if(!r.id)db[k].push(o);m.remove();await save();render();
  };
  document.body.appendChild(m);
}
async function del(k,id){if(!confirm('تأكيد الحذف؟'))return;db[k]=db[k].filter(x=>x.id!==id);await save();render()}

// ---------- الصفحات ----------
function dash(){
  const st=db.vehicles.map(v=>status(v)[0]),n=s=>st.filter(x=>x===s).length;
  return `<h2>لوحة التحكم</h2><div class="g">${[['🚗 المركبات',db.vehicles.length],['🟢 تتحرك',n('يتحرك')],['🟠 متوقفة',n('متوقف')],['🔴 غير متصلة',n('غير متصل')],['🔔 التنبيهات',alerts().length]].map(x=>`<div class="c"><h3>${x[1]}</h3><span>${x[0]}</span></div>`).join('')}</div>
  <div class="w"><table><tr><th>المركبة</th><th>السائق</th><th>الحالة</th><th>السرعة</th><th>البطارية</th><th>آخر تحديث</th></tr>
  ${db.vehicles.map(v=>{const {p}=posOf(v),s=status(v);return `<tr><td>${esc(v.name||v.plate)}</td><td>${esc(lookup('drivers',v.driverId))}</td><td><span class="t" style="background:${s[1]}">${s[0]}</span></td><td>${p?Math.round((p.speed_mps||0)*3.6)+' كم/س':'—'}</td><td>${p&&p.battery!=null?p.battery+'%':'—'}</td><td>${p?new Date(p.t).toLocaleString('ar-EG'):'—'}</td></tr>`}).join('')||'<tr><td colspan="6" class="mut">أضف مركبات وأجهزة أولاً</td></tr>'}</table></div>`;
}

const day=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const tUrl=(u,d)=>`https://api.github.com/repos/${gh.repo}/contents/tracks/${u}/${d}.json`;

function startTrack(){
  if(wid!=null)return;if(!navigator.geolocation)return toast('المتصفح لا يدعم تحديد الموقع');if(!gh)return toast('اربط قاعدة GitHub أولاً');
  wid=navigator.geolocation.watchPosition(p=>{tinfo.acc=Math.round(p.coords.accuracy);const t=p.timestamp;if(t-lastPt>=15000){lastPt=t;
      buf.push({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),a:tinfo.acc,s:p.coords.speed==null?null:+p.coords.speed.toFixed(1),t});LS.aff_buf=JSON.stringify(buf)}upd()},
    e=>{tinfo.err=e.message;upd()},{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
  navigator.wakeLock?.request('screen').then(l=>wl=l).catch(()=>{});
  tick=setInterval(flush,30000);upd();
}

async function putDay(u,d,pts){
  for(let i=0;i<2;i++){
    const r=await fetch(tUrl(u,d),{headers:hd(),cache:'no-store'});let old=[],s;
    if(r.ok){const j=await r.json();s=j.sha;old=b64d(j.content)}else if(r.status!=404)throw Error('GitHub '+r.status);
    const seen=new Set(old.map(x=>x.t)),all=old.concat(pts.filter(x=>!seen.has(x.t)));
    const body={message:'track',content:b64e(all)};if(s)body.sha=s;
    const p=await fetch(tUrl(u,d),{method:'PUT',headers:hd(),body:JSON.stringify(body)});
    if(p.ok)return;if(p.status!=409&&p.status!=422)throw Error('GitHub '+p.status);
  }
  throw Error('تعارض في الحفظ');
}
async function flush(){
  if(!gh||!me||!buf.length||flushing)return;flushing=true;const send=buf.slice(),by={};
  send.forEach(x=>(by[day(x.t)]=by[day(x.t)]||[]).push(x));
  try{for(const d in by)await putDay(me.id,d,by[d]);buf=buf.slice(send.length);LS.aff_buf=JSON.stringify(buf);tinfo.sent+=send.length;tinfo.sync=Date.now();tinfo.err=null}
  catch(e){tinfo.err=e.message}
  flushing=false;upd();
}

    if(r.ok){const a=b64d((await r.json()).content);if(a.length)liveT[u.id]=a[a.length-1]}}catch(e){}}));
}

let rm,rpts=[];
const hav=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
function analyze(p){
  let dist=0,max=0,stops=[],i=0;
  for(let k=1;k<p.length;k++){const d=hav(p[k-1],p[k]);if(d>15)dist+=d}
  p.forEach(x=>{if(x.s!=null&&x.s>max)max=x.s});
  while(i<p.length){let j=i;while(j+1<p.length&&hav(p[i],p[j+1])<50)j++;if(p[j].t-p[i].t>=300000)stops.push({a:p[i],b:p[j]});i=j+1}
  return{dist,max,stops};
}
const fm=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' س '+m%60+' د':m+' د'};
function repPage(){
  const tr=db.users.filter(u=>u.role==='tracker');
  return `<h2>تقارير المتتبعين</h2><div class="n"><label>المستخدم</label><select id="ru">${tr.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
  <label>التاريخ</label><input id="rd" type="date" value="${day(Date.now())}"><div class="r"><button class="p" onclick="showRep()">عرض التقرير</button><button onclick="csv()">تصدير CSV</button></div></div><div id="rout"></div>`;
}
async function showRep(){
  const u=$('#ru').value,d=$('#rd').value,o=$('#rout');
  if(!u)return toast('أضف مستخدمًا من نوع متتبع أولاً');if(!gh)return toast('اربط قاعدة GitHub أولاً');
  o.innerHTML='<p class="mut">جاري التحميل...</p>';
  let r;try{r=await fetch(tUrl(u,d),{headers:hd(),cache:'no-store'})}catch(e){o.innerHTML='<p class="mut">تعذّر الاتصال بـ GitHub</p>';return}
  if(r.status==404){rpts=[];o.innerHTML='<p class="mut">لا توجد بيانات لهذا اليوم</p>';return}
  if(!r.ok){o.innerHTML='<p class="mut">تعذّر التحميل: '+r.status+'</p>';return}
  rpts=b64d((await r.json()).content).sort((a,b)=>a.t-b.t);
  if(!rpts.length){o.innerHTML='<p class="mut">لا توجد بيانات لهذا اليوم</p>';return}
  if(rm){rm.remove();rm=null}
  const a=analyze(rpts),f=rpts[0],l=rpts[rpts.length-1],tm=x=>new Date(x).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),
    ln=p=>`https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lng}#map=17/${p.lat}/${p.lng}`;
  o.innerHTML=`<div class="g">${[['المسافة',(a.dist/1000).toFixed(1)+' كم'],['البداية',tm(f.t)],['النهاية',tm(l.t)],['المدة',fm(l.t-f.t)],['أقصى سرعة',Math.round(a.max*3.6)+' كم/س'],['النقاط',rpts.length]].map(x=>`<div class="c"><h3 style="font-size:18px">${x[1]}</h3><span>${x[0]}</span></div>`).join('')}</div>
  <div id="rmap" style="height:50vh;border-radius:12px;border:1px solid var(--br)"></div>
  <h3>التوقفات (5 دقائق فأكثر)</h3><div class="w"><table><tr><th>من</th><th>إلى</th><th>المدة</th><th>العنوان</th><th>الموقع</th></tr>
  ${a.stops.map(s=>`<tr><td>${tm(s.a.t)}</td><td>${tm(s.b.t)}</td><td>${fm(s.b.t-s.a.t)}</td><td data-ad="${s.a.lat},${s.a.lng}" style="white-space:normal;min-width:220px">…</td><td><a href="${ln(s.a)}" target="_blank" rel="noopener">خريطة</a></td></tr>`).join('')||'<tr><td colspan="5" class="mut">لا توجد توقفات</td></tr>'}</table></div>
  <p class="mut">البداية: <span data-ad="${f.lat},${f.lng}">…</span> (<a href="${ln(f)}" target="_blank" rel="noopener">خريطة</a>)<br>آخر نقطة: <span data-ad="${l.lat},${l.lng}">…</span> (<a href="${ln(l)}" target="_blank" rel="noopener">خريطة</a>)</p>`;
  if(!window.L){fillAddr();return}rm=L.map('rmap');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>'}).addTo(rm);
  const ll=rpts.map(p=>[p.lat,p.lng]);L.polyline(ll,{weight:4,color:'#1f6feb'}).addTo(rm);
  L.circleMarker(ll[0],{radius:8,color:'#fff',fillColor:'#1a9d55',fillOpacity:1}).addTo(rm).bindPopup('البداية '+tm(f.t));
  L.circleMarker(ll[ll.length-1],{radius:8,color:'#fff',fillColor:'#d93b3b',fillOpacity:1}).addTo(rm).bindPopup('النهاية '+tm(l.t));
  a.stops.forEach(s=>L.circleMarker([s.a.lat,s.a.lng],{radius:7,color:'#fff',fillColor:'#d98a00',fillOpacity:1}).addTo(rm).bindPopup('توقف '+fm(s.b.t-s.a.t)));
  rm.fitBounds(ll,{padding:[30,30],maxZoom:17});
  fillAddr();
}
function csv(){
  if(!rpts.length)return toast('اعرض تقريرًا أولاً');
  const s='\ufefftime,lat,lng,speed_kmh,accuracy_m\n'+rpts.map(p=>[new Date(p.t).toISOString(),p.lat,p.lng,p.s==null?'':Math.round(p.s*3.6),p.a??''].join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='track-'+($('#rd')?.value||'')+'.csv';a.click();
}

// ---------- العناوين (OpenStreetMap Nominatim) ----------
const AC=JSON.parse(LS.aff_addr||'{}'),ak=(a,b)=>a.toFixed(4)+','+b.toFixed(4);
async function addr(a,b){
  const k=ak(a,b);if(AC[k])return AC[k];
  const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=ar&lat=${a}&lon=${b}`);
  if(!r.ok)throw Error(r.status);const j=await r.json();AC[k]=j.display_name||'عنوان غير معروف';LS.aff_addr=JSON.stringify(AC);return AC[k];
}
async function fillAddr(){
  for(const e of document.querySelectorAll('[data-ad]')){
    const [a,b]=e.dataset.ad.split(',').map(Number),cached=!!AC[ak(a,b)];
    try{e.textContent=await addr(a,b)}catch(x){e.textContent='تعذّر جلب العنوان'}
    if(!cached)await new Promise(r=>setTimeout(r,1100));
  }
}

// ---------- تصفير بيانات محددة ----------
async function resetSel(){
  const c=n=>$('#rs_'+n).checked,ut=$('#rt_u').value,from=$('#rt_f').value,to=$('#rt_t').value;
  if(!['vehicles','drivers','devices','positions'].some(c)&&!ut)return toast('اختر ما تريد تصفيره');
  if(ut&&!gh)return toast('مسارات المتتبعين محفوظة على GitHub، اربط القاعدة أولاً');
  if(prompt('للتأكيد اكتب كلمة: تصفير')!=='تصفير')return;
  exp();
  if(c('vehicles')){db.vehicles=[];db.devices.forEach(d=>d.vehicleId='')}
  if(c('drivers')){db.drivers=[];db.vehicles.forEach(v=>v.driverId='')}
  if(c('devices')){db.devices=[];db.positions={}}
  if(c('positions'))db.positions={};
  noMerge=true;await save();noMerge=false;
  if(ut){
    const ids=ut==='all'?db.users.filter(u=>u.role==='tracker').map(u=>u.id):[ut];let n=0;
    for(const id of ids){
      const r=await fetch(`https://api.github.com/repos/${gh.repo}/contents/tracks/${id}`,{headers:hd(),cache:'no-store'});if(!r.ok)continue;
      for(const f of await r.json()){const d=f.name.replace('.json','');if((from&&d<from)||(to&&d>to))continue;
        const x=await fetch(f.url,{method:'DELETE',headers:hd(),body:JSON.stringify({message:'reset',sha:f.sha})});if(x.ok)n++}
    }
    liveT={};toast('تم حذف '+n+' ملف مسار');
  }else toast('تم التصفير');
  render();
}

// ---------- العرض ----------
const IC={dash:'📊',map:'🗺️',vehicles:'🚗',drivers:'🧑‍✈️',devices:'📡',alerts:'🔔',rep:'📈',track:'📍',users:'👥',settings:'⚙️'};
const P={dash:['لوحة التحكم',dash],map:['الخريطة',mapPage],vehicles:['المركبات',()=>list('vehicles')],drivers:['السائقون',()=>list('drivers')],devices:['الأجهزة',()=>list('devices')],alerts:['التنبيهات',alertsPage],rep:['تقارير المتتبعين',repPage],track:['تتبّع موقعي',trackPage],users:['المستخدمون',users],settings:['الإعدادات',settings]};
function go(p){page=p;render();if(p==='map')pullLive().then(()=>drawMap())}
function render(){
  const a=$('#app');
  if(!me&&!dbReady){a.innerHTML=connectionPage();return}
  if(!me){a.innerHTML=login();return}
  if(!allowed(page))page=me.role==='tracker'?'track':'dash';
  a.innerHTML=`<div class="shell"><aside><div class="brand">🚚 AFF<small>تتبع المركبات</small></div><nav>${Object.keys(P).filter(allowed).map(k=>`<button class="${k===page?'on':''}" onclick="go('${k}')"><span>${IC[k]}</span><span>${P[k][0]}${k==='alerts'&&alerts().length?' ('+alerts().length+')':''}</span></button>`).join('')}</nav><div class="usr"><span>${esc(me.name)}</span><button onclick="logout()">⎋ خروج</button></div></aside><div class="content"><main>${P[page][1]()}</main></div></div>`;
  if(page==='map')drawMap();
  if(page==='track'){upd();if(!manualStop&&wid==null)startTrack()}
}
setInterval(async()=>{if(!me||me.role==='tracker'||document.querySelector('.m')||document.activeElement?.tagName==='INPUT')return;await pull();if(page==='map'){await pullLive();if(!map||!map._popup||!map.hasLayer(map._popup))drawMap()}else if(page==='dash'||page==='alerts')render()},15000);
render();
</script>
